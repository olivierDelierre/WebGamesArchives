<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>MotionBall 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
	html, body { margin: 0; padding: 0; height: 100%; background: #1e0632; color: #e8d8f8; font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; overflow: hidden; }
	#wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
	#game { display: block; background: #1e0632; touch-action: none; cursor: default; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
	#touch { display: none; gap: 16px; padding: 6px; }
	#touch button { font: inherit; font-size: 16px; padding: 8px 18px; border-radius: 20px; border: 2px solid #a6ec6e; background: #3c8f1d; color: #fff; }
	@media (pointer: coarse) { #touch { display: flex; } }
	#help { position: fixed; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 12px; opacity: 0.6; pointer-events: none; }
	@media (pointer: coarse), (max-height: 480px) { #help { display: none; } }
</style>
</head>
<body>
<div id="wrap">
	<canvas id="game" width="610" height="410"></canvas>
	<div id="touch">
		<button id="tbBall" type="button">Changer de bille</button>
		<button id="tbPause" type="button">Pause / carte</button>
	</div>
</div>
<div id="help">Fl&egrave;ches (ou WASD / ZQSD) : diriger la bille &mdash; Espace : changer de bille &mdash; &Eacute;chap ou P : pause / carte</div>
<!--
	Plain scripts, loaded in dependency order (see docs/ARCHITECTURE.md).
	No modules : the game must also work when opened from the disk (file://).
-->
<!-- core : namespace, constants, Flash-like runtime -->
<script src="js/core/mb2.js"></script>
<script src="js/core/const.js"></script>
<script src="js/core/std.js"></script>
<script src="js/core/clip.js"></script>
<script src="js/core/depth_manager.js"></script>
<script src="js/core/keyboard.js"></script>
<!-- level data -->
<script src="js/data/bitcodec.js"></script>
<script src="js/data/level_format.js"></script>
<script src="js/data/assemble.js"></script>
<script src="js/data/levels.js"></script>
<script src="js/data/generator/common.js"></script>
<script src="js/data/generator/dungeon.js"></script>
<script src="js/data/generator/rooms.js"></script>
<script src="js/data/generator/challenge.js"></script>
<script src="js/data/generator/classic.js"></script>
<!-- audio -->
<script src="js/audio/sound_manager.js"></script>
<script src="js/audio/sound.js"></script>
<!-- graphics : helpers and symbols -->
<script src="js/gfx/assets.js"></script>
<script src="js/gfx/draw.js"></script>
<script src="js/gfx/symbols/room.js"></script>
<script src="js/gfx/symbols/bumpers.js"></script>
<script src="js/gfx/symbols/items.js"></script>
<script src="js/gfx/symbols/ball.js"></script>
<script src="js/gfx/symbols/hud.js"></script>
<script src="js/gfx/symbols/boss_octopus.js"></script>
<script src="js/gfx/symbols/boss_snake.js"></script>
<script src="js/gfx/symbols/boss_tourneboule.js"></script>
<script src="js/gfx/symbols/boss_effects.js"></script>
<!-- the game -->
<script src="js/game/collide.js"></script>
<script src="js/game/options.js"></script>
<script src="js/game/ball.js"></script>
<script src="js/game/interf.js"></script>
<script src="js/game/level.js"></script>
<script src="js/game/game.js"></script>
<!-- bosses -->
<script src="js/boss/common.js"></script>
<script src="js/boss/octopus.js"></script>
<script src="js/boss/serpent.js"></script>
<script src="js/boss/tourneboule.js"></script>
<script src="js/boss/powers/water.js"></script>
<script src="js/boss/powers/fire.js"></script>
<script src="js/boss/powers/earth.js"></script>
<script src="js/boss/powers/wind.js"></script>
<!-- screens -->
<script src="js/screens/common.js"></script>
<script src="js/screens/text.js"></script>
<script src="js/screens/intro.js"></script>
<script src="js/screens/menu.js"></script>
<script src="js/screens/transition.js"></script>
<script src="js/screens/pause.js"></script>
<script src="js/screens/game_over.js"></script>
<!-- application -->
<script src="js/app/save.js"></script>
<script src="js/app/titems.js"></script>
<script src="js/app/manager.js"></script>
<script src="js/app/input.js"></script>
<script src="js/app/main.js"></script>
<script>MB2.start();</script>
</body>
</html>
